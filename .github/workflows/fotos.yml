name: Bajar fotos reales (flyer y video)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_photos.py
      - run: |
          git config user.name "robot-vibras"
          git config user.email "actions@users.noreply.github.com"
          git add fotos
          git diff --cached --quiet || (git commit -m "Fotos reales para flyer y video" && git push)
